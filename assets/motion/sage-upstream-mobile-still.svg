<text x="28" y="132" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="var(--ink)">Browser research through</text>
<text x="28" y="166" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="var(--ink)">semantic fuzzing.</text>
<text x="28" y="211" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="var(--muted)">Experimental DOM fuzzer</text>
<text x="28" y="247" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="var(--muted)">with semantic fuzzing engines.</text>
