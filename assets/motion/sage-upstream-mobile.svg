<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">SaGe Browser Fuzzer</title>
<desc id="desc">Browser research through semantic fuzzing. Experimental DOM fuzzer with semantic fuzzing engines. Open the repository. Motion respects reduced-motion preferences.</desc>
<style>
:root{--paper:#f3f2ed;--ink:#242c26;--muted:#5b685d;--line:#cbd1c6;--accent:#944b2e;--art:#e6e9df;--glow:#d99c74}
@media(prefers-color-scheme:dark){:root{--paper:#1b241e;--ink:#eff0e5;--muted:#adbaaa;--line:#42513f;--accent:#eba781;--art:#253324;--glow:#b27a56}}

.float{animation:float 7s ease-in-out infinite}
.float-small{animation:float-small 7s ease-in-out -1.4s infinite}
.signal{stroke-dasharray:22 338;animation:signal 7s linear infinite;animation-delay:var(--delay,0s)}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 8s ease-in-out infinite;animation-delay:var(--delay,0s)}
.breath{animation:breath 5s ease-in-out infinite;animation-delay:var(--delay,0s)}
.meter{transform-box:fill-box;transform-origin:center;animation:meter 2.6s ease-in-out infinite;animation-delay:var(--delay,0s)}
.track{stroke-dasharray:8 8;animation:track 2s linear infinite}
.steam{animation:steam 3.8s ease-out infinite;animation-delay:var(--delay,0s)}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 20s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes float-small{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes signal{to{stroke-dashoffset:-360}}
@keyframes draw{0%,8%{stroke-dashoffset:1;opacity:.2}45%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.2}}
@keyframes breath{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes meter{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes track{to{stroke-dashoffset:-32}}
@keyframes steam{0%{transform:translateY(0);opacity:0}25%{opacity:.6}100%{transform:translate(8px,-24px);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.signal{stroke-dasharray:none;opacity:.45}.steam{opacity:.25}}
</style>
<rect x=".5" y=".5" width="639" height="319" rx="5" fill="var(--paper)" stroke="var(--line)"/>
<path d="M1 5v310" stroke="var(--accent)" stroke-width="3"/>
<text x="28" y="74" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700" fill="var(--ink)">SaGe Browser Fuzzer</text>
<g transform="translate(470,5) scale(.52)"><g fill="none" stroke="var(--muted)" stroke-width="1.6"><rect x="27" y="29" width="246" height="144" rx="12" fill="var(--art)"/><path d="M27 56h246"/><circle cx="42" cy="43" r="2.5" fill="var(--muted)" stroke="none"/><circle cx="53" cy="43" r="2.5" fill="var(--muted)" stroke="none"/><circle cx="64" cy="43" r="2.5" fill="var(--muted)" stroke="none"/><path d="M150 94v23H87v22" fill="none" stroke="var(--line)" stroke-width="1.2" /><path d="M150 94v23H87v22" fill="none" stroke="var(--accent)" stroke-width="2" pathLength="360" class="signal" style="--delay:-0.0s"/><path d="M150 94v45" fill="none" stroke="var(--line)" stroke-width="1.2" /><path d="M150 94v45" fill="none" stroke="var(--accent)" stroke-width="2" pathLength="360" class="signal" style="--delay:-1.8s"/><path d="M150 94v23h63v22" fill="none" stroke="var(--line)" stroke-width="1.2" /><path d="M150 94v23h63v22" fill="none" stroke="var(--accent)" stroke-width="2" pathLength="360" class="signal" style="--delay:-3.6s"/><rect x="129" y="73" width="42" height="22" rx="4" fill="var(--paper)" stroke="var(--accent)"/><rect x="69" y="139" width="36" height="20" rx="4" fill="var(--paper)"/><path d="M79 149h16" stroke="var(--accent)" stroke-width="3" class="breath" style="--delay:-0s"/><rect x="132" y="139" width="36" height="20" rx="4" fill="var(--paper)"/><path d="M142 149h16" stroke="var(--accent)" stroke-width="3" class="breath" style="--delay:-1s"/><rect x="195" y="139" width="36" height="20" rx="4" fill="var(--paper)"/><path d="M205 149h16" stroke="var(--accent)" stroke-width="3" class="breath" style="--delay:-2s"/></g></g>
<text x="28" y="132" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="var(--ink)">Browser research through</text>
<text x="28" y="166" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="var(--ink)">semantic fuzzing.</text>
<text x="28" y="211" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="var(--muted)">Experimental DOM fuzzer</text>
<text x="28" y="247" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="var(--muted)">with semantic fuzzing engines.</text>
<path d="M589 294l15-15m-15 0h15v15" fill="none" stroke="var(--accent)" stroke-width="2" />
</svg>
