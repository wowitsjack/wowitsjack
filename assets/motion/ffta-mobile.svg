dth="1" /><path d="M114 89l18 10-18 10-18-10Z" fill="var(--paper)" stroke="var(--line)" stroke-width="1" /><path d="M132 99l18 10-18 10-18-10Z" fill="var(--art)" stroke="var(--line)" stroke-width="1" /><path d="M150 109l18 10-18 10-18-10Z" fill="var(--paper)" stroke="var(--line)" stroke-width="1" /><path d="M168 119l18 10-18 10-18-10Z" fill="var(--art)" stroke="var(--line)" stroke-width="1" /><path d="M96 99l18 10-18 10-18-10Z" fill="var(--art)" stroke="var(--line)" stroke-width="1" /><path d="M114 109l18 10-18 10-18-10Z" fill="var(--paper)" stroke="var(--line)" stroke-width="1" /><path d="M132 119l18 10-18 10-18-10Z" fill="var(--art)" stroke="var(--line)" stroke-width="1" /><path d="M150 129l18 10-18 10-18-10Z" fill="var(--paper)" stroke="var(--line)" stroke-width="1" /></g><path d="M117 164h66" fill="none" stroke="var(--accent)" stroke-width="2" /></g></g>
<text x="28" y="132" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" fill="var(--ink)">Final Fantasy Tactics Advance</text>
<text x="28" y="190" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="var(--muted)">ROM analysis, byte-exact</text>
<text x="28" y="226" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="var(--muted)">splitting, and disassembly.</text>
