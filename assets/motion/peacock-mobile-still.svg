<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
<title id="title">Peacock for Steam Deck</title>
<desc id="desc">A SteamOS launcher for the Peacock HITMAN server emulator. Open the repository. Motion respects reduced-motion preferences.</desc>
<style>
:root{--paper:#f3f2ed;--ink:#242c26;--muted:#5b685d;--line:#cbd1c6;--accent:#944b2e;--art:#e6e9df;--glow:#d99c74}
@media(prefers-color-scheme:dark){:root{--paper:#1b241e;--ink:#eff0e5;--muted:#adbaaa;--line:#42513f;--accent:#eba781;--art:#253324;--glow:#b27a56}}

.signal{stroke-dasharray:none;opacity:.45}.steam{opacity:.25}
</style>
<rect x=".5" y=".5" width="639" height="189" rx="5" fill="var(--paper)" stroke="var(--line)" />
<path d="M1 5v180" stroke="var(--accent)" stroke-width="3" />
<text x="26" y="53" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="var(--ink)">Peacock for Steam Deck</text>
<text x="26" y="108" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="var(--muted)">A SteamOS launcher for the</text>
<text x="26" y="145" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" fill="var(--muted)">Peacock HITMAN server emulator.</text>
<g transform="translate(484,2) scale(.5)"><g fill="none" stroke="var(--muted)" stroke-width="1.6"><circle cx="150" cy="100" r="70" stroke="var(--line)" /><circle cx="150" cy="100" r="46" fill="var(--art)" /><path d="M150 17v25m0 116v25M67 100h25m116 0h25" /><circle cx="150" cy="100" r="17" stroke="var(--accent)" /><circle cx="150" cy="100" r="4" fill="var(--accent)" stroke="none" /><g class="orbit"><circle cx="150" cy="100" r="58" stroke="var(--line)" stroke-dasharray="3 14" /><path d="M150 42a58 58 0 0 1 58 58" stroke="var(--accent)" stroke-width="3" /></g></g></g>
</svg>