<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="142" viewBox="0 0 1200 142" role="img" aria-labelledby="title desc">
<title id="title">ai-v</title>
<desc id="desc">Standalone Voice PE firmware. Choose your speech, LLM, and voice providers. Open the repository. Motion respects reduced-motion preferences.</desc>
<style>
:root{--paper:#f3f2ed;--ink:#242c26;--muted:#5b685d;--line:#cbd1c6;--accent:#944b2e;--art:#e6e9df;--glow:#d99c74}
@media(prefers-color-scheme:dark){:root{--paper:#1b241e;--ink:#eff0e5;--muted:#adbaaa;--line:#42513f;--accent:#eba781;--art:#253324;--glow:#b27a56}}

.float{animation:float 7s ease-in-out infinite}
.float-small{animation:float-small 7s ease-in-out -1.4s infinite}
.signal{stroke-dasharray:22 338;animation:signal 7s linear infinite;animation-delay:var(--delay,0s)}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 8s ease-in-out infinite;animation-delay:var(--delay,0s)}
.breath{animation:breath 5s ease-in-out infinite;animation-delay:var(--delay,0s)}
.meter{transform-box:fill-box;transform-origin:center;animation:meter 2.6s ease-in-out infinite;animation-delay:var(--delay,0s)}
.track{stroke-dasharray:8 8;animation:track 2s linear infinite}
.steam{animation:steam 3.8s ease-out infinite;animation-delay:var(--delay,0s)}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 20s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes float-small{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes signal{to{stroke-dashoffset:-360}}
@keyframes draw{0%,8%{stroke-dashoffset:1;opacity:.2}45%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.2}}
@keyframes breath{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes meter{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes track{to{stroke-dashoffset:-32}}
@keyframes steam{0%{transform:translateY(0);opacity:0}25%{opacity:.6}100%{transform:translate(8px,-24px);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.signal{stroke-dasharray:none;opacity:.45}.steam{opacity:.25}}
</style>
<rect x=".5" y=".5" width="1199" height="141" rx="5" fill="var(--paper)" stroke="var(--line)"/>
<path d="M1 5v132" stroke="var(--accent)" stroke-width="3"/>
<text x="32" y="55" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="var(--ink)">ai-v</text>
<text x="32" y="97" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="var(--muted)">Standalone Voice PE firmware. Choose your speech, LLM, and voice providers.</text>
<g transform="translate(997,0) scale(.69)"><g stroke="var(--muted)" fill="none" stroke-width="1.6"><rect x="83" y="29" width="142" height="142" rx="28" fill="var(--art)"/><rect x="93" y="39" width="122" height="122" rx="20"/><path d="M121 92.0v16" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-0.0s"/><path d="M132 84.0v32" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-0.37s"/><path d="M143 75.5v49" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-0.74s"/><path d="M154 67.0v66" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-1.1099999999999999s"/><path d="M165 75.5v49" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-1.48s"/><path d="M176 84.0v32" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-1.85s"/><path d="M187 92.0v16" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" class="meter" style="--delay:-2.2199999999999998s"/><circle cx="154" cy="145" r="3" fill="var(--accent)" stroke="none"/><path d="M64 68q-18 32 0 64m180-64q18 32 0 64" stroke="var(--line)" class="breath"/></g></g>
</svg>
